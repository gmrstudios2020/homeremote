<!doctype html>
<html lang="en">
<head>
<!-- intercom-config v15 relative-api fix -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<!-- intercom-config v14 secure-path fix -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intercom Manager</title>
<style>
:root{color-scheme:dark;--text:#f3f5f7;--muted:#8e98a4;--green:#8fcf3c;--red:#8f2429}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 0,#18202a 0,#0b0f13 36%,#050608 100%);color:var(--text);min-height:100vh}
.wrap{max-width:940px;margin:0 auto;padding:34px 18px 60px}
header{text-align:center;margin-bottom:28px}
.sub{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.panel{background:linear-gradient(180deg,#151b21,#0d1115);border:1px solid #2c343d;border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.035);padding:18px}
.receiver-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;padding:12px 14px;border:1px solid #2e3640;border-radius:12px;background:linear-gradient(180deg,#141a20,#0d1115)}
.receiver-title{font-weight:800;letter-spacing:.5px}
.receiver-warning{margin-top:4px;font-size:11px;color:#d8a75a;letter-spacing:.35px}
.receiver-warning.ready{color:var(--green)}
.receiver-power{min-width:132px}
.receiver-power.off{border-color:#70a45a;color:#c8f0b6;background:linear-gradient(180deg,#31422c,#22301f 55%,#172015)}
.receiver-power.on{border-color:#a65258;color:#ffc0c4;background:linear-gradient(180deg,#472b2e,#332023 55%,#211517)}
.creator{padding:15px;border:1px solid #2e3640;border-radius:12px;background:#0d1115;margin-bottom:18px}
.creator-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
label{display:block;color:var(--muted);font-size:11px;letter-spacing:.7px;margin:0 0 6px 4px;text-transform:uppercase}
input[type=text],input[type=file]{width:100%;min-height:46px;color:var(--text);background:#090c10;border:1px solid #343d47;border-radius:10px;padding:10px 12px}
button{min-height:46px;border-radius:10px;border:1px solid #414b56;color:#f5f6f8;font-weight:700;background:linear-gradient(180deg,#2b3139,#1a2027 55%,#101419);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 7px rgba(0,0,0,.25);padding:0 16px;cursor:pointer}
button:hover{border-color:#6f8fba} button:disabled{opacity:.45;cursor:not-allowed}
.primary{border-color:#8698c1;background:linear-gradient(180deg,#8191b6,#667aa4 52%,#4e6086)}
.record{border-color:#b44950;background:linear-gradient(180deg,#a63239,#7e2228 52%,#57171b);color:#fff;min-width:150px}
.record.recording{animation:pulse 1.1s infinite;background:linear-gradient(180deg,#d0444c,#a5272f 52%,#741b21)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(196,50,58,.15),inset 0 1px 0 rgba(255,255,255,.16)}}
.source-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
.or{color:#69737e;font-size:11px;font-weight:700;letter-spacing:1px}
.record-state{color:var(--muted);font-size:12px;min-width:130px}
.creator-save{margin-top:12px;display:flex;justify-content:flex-end}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(160px,1fr) repeat(4,auto);gap:9px;align-items:center;padding:12px;border:1px solid #2e3640;border-radius:12px;background:linear-gradient(180deg,#141a20,#0d1115)}
.name{font-weight:800;letter-spacing:.5px}.state{color:var(--green);font-size:11px;margin-top:4px}.state.off{color:#7c8690}
.delete{border-color:#6b3639;color:#ffb9bd}.status{margin:14px 2px 0;color:var(--muted);font-size:12px;min-height:18px}.empty{text-align:center;color:var(--muted);padding:26px}
.hidden{display:none!important}
@media(max-width:720px){.creator-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .namebox{grid-column:1/-1}.receiver-strip{align-items:flex-start}.receiver-power{min-width:112px}}

/* v8 config-page cleanup */
header{margin-bottom:22px}
.sub{margin-top:0}

.row{
  grid-template-columns:minmax(120px,1fr) auto auto auto auto auto!important;
  gap:7px!important;
  padding:10px 11px!important;
}
.row button{
  min-height:38px!important;
  height:38px!important;
  padding:0 11px!important;
  font-size:11px!important;
  white-space:nowrap!important;
}
.row .delete{
  min-height:32px!important;
  height:32px!important;
  padding:0 8px!important;
  font-size:10px!important;
  align-self:center!important;
}
@media(max-width:720px){
  .row{
    grid-template-columns:minmax(105px,1fr) auto auto auto auto auto!important;
    overflow-x:auto;
  }
  .row .namebox{grid-column:auto!important}
  .row button{
    padding:0 8px!important;
    font-size:10px!important;
  }
  .row .delete{
    padding:0 6px!important;
    font-size:9px!important;
  }
}


/* v9 definitive config layout */
.configHeader{
  text-align:left!important;
  margin:0 0 18px!important;
  color:#c7cdd4!important;
  font-size:13px!important;
  font-weight:700!important;
  letter-spacing:1.6px!important;
}

.list .row{
  display:flex!important;
  flex-wrap:nowrap!important;
  align-items:center!important;
  gap:7px!important;
  padding:9px 10px!important;
  overflow-x:auto!important;
}

.list .row .namebox{
  flex:1 1 auto!important;
  min-width:145px!important;
  grid-column:auto!important;
}

.list .row button{
  flex:0 0 auto!important;
  width:auto!important;
  min-width:0!important;
  min-height:34px!important;
  height:34px!important;
  padding:0 10px!important;
  font-size:10px!important;
  white-space:nowrap!important;
}

.list .row .delete{
  min-height:27px!important;
  height:27px!important;
  padding:0 7px!important;
  font-size:9px!important;
  border-radius:8px!important;
}

@media(max-width:720px){
  .list .row{
    display:flex!important;
    flex-wrap:nowrap!important;
  }
  .list .row .namebox{
    min-width:125px!important;
  }
  .list .row button{
    height:32px!important;
    min-height:32px!important;
    padding:0 8px!important;
    font-size:9px!important;
  }
  .list .row .delete{
    height:25px!important;
    min-height:25px!important;
    padding:0 6px!important;
    font-size:8px!important;
  }
}


/* v10: DELETE matches the other action buttons in size */
.list .row .delete{
  min-height:34px!important;
  height:34px!important;
  padding:0 10px!important;
  font-size:10px!important;
  border-radius:10px!important;
  border-color:#8f353b!important;
  color:#ffd2d5!important;
  background:linear-gradient(180deg,#8f2d34,#6f2026 52%,#4b161a)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 3px 7px rgba(0,0,0,.25)!important;
}
@media(max-width:720px){
  .list .row .delete{
    min-height:32px!important;
    height:32px!important;
    padding:0 8px!important;
    font-size:9px!important;
    border-radius:10px!important;
  }
}

.backRemote{position:absolute;right:14px;color:#8e98a4;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.7px}.backRemote:hover{color:#e1e5e9}.configHeader{position:relative}.volume-strip{margin:-7px 0 18px;padding:10px 14px 12px;border:1px solid #2e3640;border-radius:12px;background:#0d1115}.volume-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#8e98a4;font-size:10px;font-weight:700;letter-spacing:.7px}.volume-buttons{display:flex;align-items:center;gap:7px}.volume-buttons button{width:30px;min-height:28px;height:28px;padding:0;font-size:17px}#volumeValue{min-width:42px;text-align:center;color:#e1e5e9;font-size:12px;letter-spacing:0}#announcementVolume{width:100%;margin:9px 0 0;accent-color:#8796b4}</style>
</head>
<body>
<div class="wrap">
<header class="configHeader"><a href="../" class="backRemote" aria-label="Back to remote">REMOTE</a><span>WHOLE HOUSE INTERCOM MANAGER</span></header>
<div class="panel">
<div class="receiver-strip">
 <div><div class="receiver-title">STR-ZA1100ES</div><div id="receiverWarning" class="receiver-warning">CHECKING RECEIVER POWER…</div></div>
 <button id="receiverPowerBtn" class="receiver-power" type="button">POWER</button>
</div>
<div class="volume-strip"><div class="volume-top"><span>ANNOUNCEMENT VOLUME</span><div class="volume-buttons"><button id="volumeDown" type="button">−</button><span id="volumeValue">70%</span><button id="volumeUp" type="button">+</button></div></div><input id="announcementVolume" type="range" min="0" max="100" step="5" value="70"></div>

<form id="addForm" class="creator">
 <div class="creator-grid">
  <div><label for="label">Button name</label><input id="label" name="label" type="text" maxlength="40" placeholder="DINNER TIME" required></div>
  <div><label for="audio">Upload audio</label><input id="audio" name="audio" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.webm"></div>
 </div>
 <div class="source-actions">
  <span class="or">OR</span>
  <button id="recordBtn" class="record" type="button">● RECORD</button>
  <button id="recordPreviewBtn" type="button" disabled>PREVIEW RECORDING</button>
  <button id="rerecordBtn" type="button" disabled>RE-RECORD</button>
  <span id="recordState" class="record-state">No recording</span>
 </div>
 <div class="creator-save"><button class="primary" type="submit">SAVE ANNOUNCEMENT</button></div>
</form>

<div id="list" class="list"></div>
<div id="status" class="status"></div>
</div></div>

<script>
const listEl=document.getElementById('list'),statusEl=document.getElementById('status'),addForm=document.getElementById('addForm');
const audioInput=document.getElementById('audio'),recordBtn=document.getElementById('recordBtn'),recordPreviewBtn=document.getElementById('recordPreviewBtn'),rerecordBtn=document.getElementById('rerecordBtn'),recordState=document.getElementById('recordState');
const receiverPowerBtn=document.getElementById('receiverPowerBtn'),receiverWarning=document.getElementById('receiverWarning');
const announcementVolume=document.getElementById('announcementVolume'),volumeValue=document.getElementById('volumeValue'),volumeDown=document.getElementById('volumeDown'),volumeUp=document.getElementById('volumeUp');
let recorder=null,chunks=[],recordedBlob=null,recordedUrl=null,stream=null;
const status=m=>statusEl.textContent=m||'';
function intercomUrl(path){
  return String(path).replace(/^\/+/, '');
}
async function api(url,opts={}){const r=await fetch(intercomUrl(url),{cache:'no-store',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let volumeSaveTimer=null;
async function loadVolume(){try{const s=await api('api/settings');const v=Number(s.announcement_volume??70);announcementVolume.value=v;volumeValue.textContent=v+'%'}catch(e){status('Could not load announcement volume.')}}
function setVolumeUI(v){v=Math.max(0,Math.min(100,Math.round(v/5)*5));announcementVolume.value=v;volumeValue.textContent=v+'%';clearTimeout(volumeSaveTimer);volumeSaveTimer=setTimeout(async()=>{try{await api('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({announcement_volume:v})})}catch(e){status('Could not save announcement volume.')}},180)}
announcementVolume.addEventListener('input',()=>setVolumeUI(Number(announcementVolume.value)));
volumeDown.addEventListener('click',()=>setVolumeUI(Number(announcementVolume.value)-5));
volumeUp.addEventListener('click',()=>setVolumeUI(Number(announcementVolume.value)+5));

async function refreshReceiverPower(){
 try{const d=await api('api/receiver-power');const on=d.power==='on';receiverPowerBtn.className='receiver-power '+(on?'on':'off');receiverPowerBtn.textContent=on?'POWER OFF':'POWER ON';receiverWarning.className='receiver-warning '+(on?'ready':'');receiverWarning.textContent=on?'RECEIVER ON • INTERCOM READY':'RECEIVER MUST BE ON FOR PLAY HOUSE'}
 catch(e){receiverPowerBtn.className='receiver-power';receiverPowerBtn.textContent='POWER';receiverWarning.className='receiver-warning';receiverWarning.textContent='RECEIVER STATUS UNAVAILABLE'}
}
receiverPowerBtn.addEventListener('click',async()=>{receiverPowerBtn.disabled=true;status('Changing receiver power…');try{await api('api/receiver-power/toggle',{method:'POST'});await refreshReceiverPower();status('')}catch(e){status(e.message)}finally{receiverPowerBtn.disabled=false}});

function clearRecording(){
 if(recordedUrl) URL.revokeObjectURL(recordedUrl);
 recordedBlob=null;recordedUrl=null;chunks=[];
 recordPreviewBtn.disabled=true;rerecordBtn.disabled=true;recordState.textContent='No recording';
}
async function startRecording(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Microphone recording is not supported by this browser.');return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   recordedBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
   recordedUrl=URL.createObjectURL(recordedBlob);
   recordPreviewBtn.disabled=false;rerecordBtn.disabled=false;
   recordState.textContent='Recording ready';
   recordBtn.textContent='● RECORD';recordBtn.classList.remove('recording');
   if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  };
  recorder.start();
  recordBtn.textContent='■ STOP RECORDING';recordBtn.classList.add('recording');
  recordState.textContent='Recording…';
  audioInput.value='';
 }catch(e){status('Microphone permission was not granted or is unavailable.')}
}
recordBtn.addEventListener('click',()=>{if(recorder&&recorder.state==='recording')recorder.stop();else startRecording()});
rerecordBtn.addEventListener('click',()=>{clearRecording();startRecording()});
recordPreviewBtn.addEventListener('click',()=>{if(recordedUrl)new Audio(recordedUrl).play()});
audioInput.addEventListener('change',()=>{if(audioInput.files.length)clearRecording()});

async function load(){
 const items=await api('api/announcements');
 if(!Array.isArray(items)){
   throw new Error('Announcements API returned '+Object.prototype.toString.call(items));
 }
 items.sort((a,b)=>(a.order||0)-(b.order||0));
 if(!items.length){listEl.innerHTML='<div class="empty">No announcements yet.</div>';return}
 listEl.innerHTML='';
 for(const item of items){
  const row=document.createElement('div');row.className='row';
  const name=document.createElement('div');name.className='namebox';name.innerHTML=`<div class="name">${esc(item.label)}</div><div class="state ${item.enabled?'':'off'}">${item.enabled?'ENABLED':'DISABLED'}</div>`;
  const preview=document.createElement('button');preview.textContent='PREVIEW';preview.onclick=()=>new Audio(intercomUrl('api/announcements/'+item.id+'/audio')).play();
  const replace=document.createElement('button');replace.textContent='REPLACE AUDIO';replace.onclick=()=>replaceAudio(item);
  const toggle=document.createElement('button');toggle.textContent=item.enabled?'DISABLE':'ENABLE';toggle.onclick=async()=>{await api('api/announcements/'+item.id+'/toggle',{method:'POST'});load()};
  const play=document.createElement('button');play.textContent='PLAY HOUSE';play.onclick=async()=>{play.disabled=true;try{const p=await api('api/receiver-power');if(p.power!=='on'){status('Receiver is off. Turn it on above before using PLAY HOUSE.');await refreshReceiverPower();return}status('Playing '+item.label+'…');await api('api/announcements/'+item.id+'/play',{method:'POST'});status('Finished.')}catch(e){status(e.message)}finally{play.disabled=false}};
  const del=document.createElement('button');del.className='delete';del.textContent='DELETE';del.onclick=async()=>{if(confirm('Delete '+item.label+'?')){await api('api/announcements/'+item.id,{method:'DELETE'});load()}};
  row.append(name,preview,replace,toggle,play,del);listEl.appendChild(row);
 }
}
async function replaceAudio(item){
 const input=document.createElement('input');input.type='file';input.accept='audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.webm';
 input.onchange=async()=>{if(!input.files.length)return;const fd=new FormData();fd.append('audio',input.files[0]);status('Replacing audio for '+item.label+'…');try{await api('api/announcements/'+item.id+'/audio',{method:'POST',body:fd});status('Audio replaced.')}catch(e){status(e.message)}};
 input.click();
}
addForm.addEventListener('submit',async e=>{
 e.preventDefault();
 const label=document.getElementById('label').value.trim();
 if(!label){status('Enter a button name.');return}
 if(!audioInput.files.length&&!recordedBlob){status('Upload a file or make a recording first.');return}
 const fd=new FormData();fd.append('label',label);
 if(recordedBlob){let ext=(recorder&&recorder.mimeType&&recorder.mimeType.includes('ogg'))?'ogg':'webm';fd.append('audio',recordedBlob,'recording.'+ext)}
 else fd.append('audio',audioInput.files[0]);
 status('Preparing announcement…');
 try{await api('api/announcements',{method:'POST',body:fd});addForm.reset();clearRecording();status('Announcement saved.');load()}catch(err){status(err.message)}
});
refreshReceiverPower();loadVolume();load().catch(e=>status(e.message));
</script>
</body></html>
